name: Stride
options:
  bundleIdPrefix: com.mujassir
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
targets:
  Stride:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Stride
        excludes:
          - Info.plist
          - Stride.entitlements
          # GPS workout recording is not in 1.0 (stats only); kept for a later version.
          - Views/Move/**
          - Views/Log/**
          - Views/Today/TodayView.swift
          - Views/Today/WeeklyStepsChart.swift
          - Services/LocationService.swift
          - Services/PedometerService.swift
          - Services/WorkoutSessionManager.swift
          - Models/Workout.swift
          - Models/RoutePoint.swift
          - Resources/DemoRun.gpx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mujassir.runcheck
        PRODUCT_NAME: Stride
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "3"
        DEVELOPMENT_TEAM: KMW97A6XG2
        INFOPLIST_FILE: Stride/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Stride/Stride.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: true
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    entitlements:
      path: Stride/Stride.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
schemes:
  Stride:
    build:
      targets:
        Stride: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
